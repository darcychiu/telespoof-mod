name: build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.9'
          cache-disabled: true

      - name: Build debug APK
        shell: bash
        run: |
          set -o pipefail
          gradle assembleDebug --no-daemon --stacktrace 2>&1 | tee build.log

      - name: Report failure
        if: failure()
        shell: bash
        run: |
          echo "::error::gradle build failed"
          sed -n '/What went wrong/,/^\* Try/p' build.log | head -n 25 | sed 's/^/::error::/'
          grep -nE "^e: |error:|FAILURE: |Execution failed for task" build.log | head -n 15 | sed 's/^/::error::/'

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: TeleSpoof-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
